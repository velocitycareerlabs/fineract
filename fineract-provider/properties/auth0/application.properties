spring.profiles.default=basicauth
spring.profiles.active=auth0
management.health.jms.enabled=false

# FINERACT-883
management.info.git.mode=FULL

# FINERACT-914
server.forward-headers-strategy=framework
spring.cache.jcache.config=classpath:/META-INF/spring/ehcache.xml

# The deployment sets the Auth0 tenant, and Fineract fails to start without it. The audience and domain have no
# default. The issuer keeps an empty one: without an issuer there's no JwtDecoder, which stops startup, whereas an
# unresolved placeholder would only fail the first request.
auth0.audience=${FINERACT_SECURITY_AUTH0_AUDIENCE}
auth0.domain=${FINERACT_SECURITY_AUTH0_DOMAIN}
# trailing slash is important!
spring.security.oauth2.resourceserver.jwt.issuer-uri=${FINERACT_SECURITY_AUTH0_ISSUER_URI:}
server.tomcat.accesslog.enabled=true

